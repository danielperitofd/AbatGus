<section class="content-card">
  <div class="section-heading">
    <div>
      <h2>{{ title }}</h2>
      <p>{{ description }}</p>
    </div>
    {% if create_url %}
      <a href="{{ create_url }}" class="btn btn-primary rounded-4"><i class="bi bi-plus-circle me-2"></i>Novo</a>
    {% endif %}
  </div>
  <div class="table-responsive">
    <table class="table abat-table align-middle">
      {% block table %}{% endblock %}
    </table>
  </div>
</section>
