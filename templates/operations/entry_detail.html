{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Detalhes" %} | AbatGus{% endblock %}
{% block content %}
<section class="content-card">
  <div class="section-heading">
    <div>
      <h2>{{ page_title }}</h2>
      <p>{{ page_description }}</p>
    </div>
  </div>
  <div class="row g-3">
    {% for label, value in detail_fields %}
      <div class="col-md-6 col-xl-4">
        <div class="metric-card h-100">
          <div class="metric-label">{{ label|capfirst }}</div>
          <div class="metric-foot">{{ value|default:"-" }}</div>
        </div>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
